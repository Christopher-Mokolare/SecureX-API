version: 1.0
runtime: docker

build:
  commands:
    build:
      - echo "Using pre-built ECR image"

run:
  runtime-version: latest
  command: dotnet SecureX.Api.dll
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: ASPNETCORE_ENVIRONMENT
      value: Production
    - name: DATABASE_SSL
      value: "true"
