services:
  - type: web
    name: securex-api
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ALLOWED_ORIGINS
        value: "https://securex-fe.web.app,https://securex-staging.web.app,http://localhost:4200,http://localhost:3000"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: OZOW_ACCESS_TOKEN
        sync: false
      - key: OZOW_API_KEY
        sync: false
      - key: OZOW_SITE_CODE
        sync: false
      - key: OZOW_PRIVATE_KEY
        sync: false
      - key: OZOW_PAYOUT_API_KEY
        sync: false
      - key: OZOW_PAYOUT_BASE_URL
        sync: false
      - key: OZOW_ACCOUNT_NUMBER_DECRYPTION_KEY
        sync: false
      - key: SMILEID_PARTNER_ID
        sync: false
      - key: SMILEID_API_KEY
        sync: false
      - key: SMILEID_BASE_URL
        sync: false
      - key: THISISME_API_KEY
        sync: false
      - key: THISISME_BASE_URL
        sync: false
