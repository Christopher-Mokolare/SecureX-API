<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureX — Add Bank Details</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.08); padding: 40px; width: 100%; max-width: 480px; }
    .logo { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .logo span { color: #2563eb; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 28px; }
    label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; color: #1a1a1a; background: #fff; outline: none; transition: border-color .15s; }
    select:focus, input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .field { margin-bottom: 18px; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 8px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; display: none; }
    .alert.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Secure<span>X</span></div>
    <h1>Add Your Bank Details</h1>
    <p class="subtitle">Your payout will be sent here once the buyer confirms receipt.</p>

    <div class="alert error" id="errorBox"></div>
    <div class="alert success" id="successBox"></div>

    <form id="bankForm">
      <div class="field">
        <label for="userId">Your User ID</label>
        <input type="text" id="userId" placeholder="Paste your user ID from the deal confirmation" required />
        <p class="hint">Sent to you in your deal confirmation email.</p>
      </div>

      <div class="field">
        <label for="idNumber">SA ID Number</label>
        <input type="text" id="idNumber" placeholder="13-digit South African ID number" maxlength="13" required />
        <p class="hint">Used for bank account verification (AVS).</p>
      </div>

      <div class="field">
        <label for="bank">Bank</label>
        <select id="bank" required>
          <option value="" disabled selected>Select your bank…</option>
        </select>
      </div>

      <div class="field">
        <label for="accountNumber">Account Number</label>
        <input type="text" id="accountNumber" placeholder="e.g. 1234567890" required />
      </div>

      <div class="field">
        <label for="branchCode">Branch Code</label>
        <input type="text" id="branchCode" placeholder="e.g. 051001" required />
        <p class="hint">Auto-filled when you select your bank. Edit if needed.</p>
      </div>

      <button type="submit" id="submitBtn">Save Bank Details</button>
    </form>
  </div>

  <script>
    const API = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:8080'
      : 'http://securex-alb-1751040376.af-south-1.elb.amazonaws.com';

    // Common branch codes for major SA banks
    const BRANCH_CODES = {
      'ABSA': '632005',
      'FNB': '250655',
      'Standard Bank': '051001',
      'Nedbank': '198765',
      'Capitec': '470010',
      'African Bank': '430000',
      'Bidvest Bank': '462005',
      'Discovery Bank': '679000',
      'TymeBank': '678910',
      'Investec': '580105',
    };

    async function loadBanks() {
      const select = document.getElementById('bank');
      try {
        const token = sessionStorage.getItem('sx_token');
        const res = await fetch(`${API}/api/users/banks`, {
          headers: token ? { Authorization: `Bearer ${token}` } : {}
        });
        if (res.ok) {
          const banks = await res.json();
          const list = Array.isArray(banks) ? banks : (banks.banks ?? banks.Banks ?? []);
          list.forEach(b => {
            const opt = document.createElement('option');
            opt.value = JSON.stringify({ id: b.bankGroupId ?? b.BankGroupId ?? b.id, name: b.name ?? b.Name });
            opt.textContent = b.name ?? b.Name;
            select.appendChild(opt);
          });
          return;
        }
      } catch (_) {}
      // Fallback: populate from known banks
      Object.entries(BRANCH_CODES).forEach(([name]) => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ id: name, name });
        opt.textContent = name;
        select.appendChild(opt);
      });
    }

    document.getElementById('bank').addEventListener('change', function () {
      try {
        const { name } = JSON.parse(this.value);
        if (BRANCH_CODES[name]) document.getElementById('branchCode').value = BRANCH_CODES[name];
      } catch (_) {}
    });

    document.getElementById('bankForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorBox = document.getElementById('errorBox');
      const successBox = document.getElementById('successBox');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const userId = document.getElementById('userId').value.trim();
      const idNumber = document.getElementById('idNumber').value.trim();
      const accountNumber = document.getElementById('accountNumber').value.trim();
      const branchCode = document.getElementById('branchCode').value.trim();

      let bankGroupId = '';
      try { bankGroupId = JSON.parse(document.getElementById('bank').value).id; } catch (_) {}

      if (!userId || !idNumber || !accountNumber || !branchCode || !bankGroupId) {
        errorBox.textContent = 'Please fill in all fields.';
        errorBox.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Saving…';

      try {
        const token = sessionStorage.getItem('sx_token');
        const res = await fetch(`${API}/api/users/${userId}/bank-details`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ accountNumber, branchCode, bankGroupId, idNumber })
        });

        const data = await res.json();

        if (!res.ok) {
          errorBox.textContent = data.Error ?? data.error ?? 'Something went wrong. Please try again.';
          errorBox.style.display = 'block';
          return;
        }

        const verified = data.bankVerificationStatus === 'Approved';
        successBox.textContent = verified
          ? '✓ Bank details saved and verified successfully. You will receive your payout once the deal completes.'
          : '✓ Bank details saved. Bank verification is pending — you will still receive your payout.';
        successBox.style.display = 'block';
        document.getElementById('bankForm').reset();
      } catch (err) {
        errorBox.textContent = 'Network error. Please check your connection and try again.';
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Bank Details';
      }
    });

    loadBanks();
  </script>
</body>
</html>
