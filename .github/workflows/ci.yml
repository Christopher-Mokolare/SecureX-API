name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SecureX.Api/SecureX.Api.csproj

      - name: Build
        run: dotnet build SecureX.Api/SecureX.Api.csproj --configuration Release --no-restore

      - name: Validate EF migrations
        env:
          ASPNETCORE_ENVIRONMENT: Production
          JWT_SECRET: ci-migration-validation-secret
        run: |
          dotnet tool install --global dotnet-ef --version 9.0.4
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations list \
            --project SecureX.Api/SecureX.Api.csproj \
            --startup-project SecureX.Api/SecureX.Api.csproj \
            --configuration Release \
            --no-build | tee /tmp/ef-migrations.txt
          for migration in \
            20260919010000_HardenReconciliationProviderStatus \
            20260919020000_CreateSystemFailureLogs \
            20260919030000_EnforceActivePayoutUniqueness
          do
            grep -F "$migration" /tmp/ef-migrations.txt
          done

      - name: Test
        shell: bash
        run: |
          if find . -name '*Tests.csproj' -o -name '*Test.csproj' | grep -q .; then
            dotnet test --configuration Release --no-build --no-restore
          else
            echo "No test project found; build verification completed."
          fi
